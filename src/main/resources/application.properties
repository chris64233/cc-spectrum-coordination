spring.application.name=cc-spectrum-coordination

# 默认使用内嵌 H2（文件持久化），可用环境变量覆盖为其他数据库
spring.datasource.url=jdbc:h2:mem:spectrumdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 悲观锁等待时间（毫秒），避免并发批准时过早锁超时
spring.jpa.properties.jakarta.persistence.lock.timeout=10000
